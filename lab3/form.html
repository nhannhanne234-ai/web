<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <form>
            <tr>
                <td>
                    <label for="">Username</label>
                </td>
                <td>
                    <input id="user" type="text" placeholder="Enter username">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Password</label>
                </td>
                <td>
                    <input type="password" placeholder="Enter password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Web server</label>
                </td>
                <td>
                    <select name="" id="">
                        <option value="">Vietnam</option>
                        <option value="">Singapore</option>
                        <option value="">US</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Choose role</label>
                </td>
                <td>
                    <label for=""><input name="role" type="radio">IT</label> <br>
                    <label for=""><input name="role" type="radio">DEV</label> <br>
                    <label for=""><input name="role" type="radio">BA</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Single Sign-on</label>
                </td>
                <td>
                    <label><input type="checkbox">Mail</label> <br>
                    <label><input type="checkbox">Zalo</label> <br>
                    <label><input type="checkbox">Instagram</label>
                </td>
            </tr>
            <tr>
                <td>Choose a file</td>
                <td>
                    <input type="file">
                </td>
            </tr>
            <tr>
                <td><label for="">Pick a data</label></td>
                <td>
                    <input type="data">
                </td>
            </tr>
            <tr>
                <td>Pick a color</td>
                <td>
                    <input type="color" name="" id="">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Enter your age</label>
                </td>
                <td>
                    <input type="number" name="" id="">
                </td>
            </tr>
            <tr>
                <td>Introduction</td>
                <td><textarea name="" id=""></textarea></td>
            </tr>
            <tr>
                <td type="submit" value="Send data"></td>
                <td type="reset" value="Reset"></td>
            </tr>
        </form>
    </table>
</body>
</html>
