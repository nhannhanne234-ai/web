<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <tr bgcolor="cyan">
            <th>Device</th>
            <th>Brand</th>
            <th colspan="2">Specifications</th>
        </tr>
        <tr>
            <td rowspan="3">Smartphone</td>
            <td rowspan="3">Apple</td>
            <th bgcolor="yellow">Model</th>
            <th bgcolor="yellow">Storage</th>
        </tr>
        <tr>
            <td>iPhone 12 Pro</td>
            <td>256GB</td>
        </tr>
        <tr>
            <td>iPhone SE</td>
            <td>128GB</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td colspan="2">15.6"Dispaly</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td colspan="2">10.5"Dispaly</td>
        </tr>
    </table>
    <h2>Registration Form</h2>
    <table>
        <form action="">
            <tr>
                <td>First Name :</td>
                <td>
                    <input type="text" placeholder="Enter First Name">
                </td>
            </tr>
            <br>
            <tr>
                <td>Last Name :</td>
                <td>
                    <input type="text" placeholder="Enter Last Name">
                </td>
            </tr>
            <br>
            <tr>
                <td>Email :</td>
                <td>
                    <input type="email" placeholder="Enter Email Address">
                </td>
            </tr>
            <br>
            <tr>
                <td>Password :</td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <br>
            <tr>
                <td>Gender:</td><br>
                <td>
                    <label><input type="radio" name="gender"> Male</label><br>
                    <label><input type="radio" name="gender"> Female</label><br>
                    <label><input type="radio" name="gender"> Other</label>
                </td>
            </tr>
            <br>
            <tr>
                <td>Age :</td>
                <td>
                    <input type="number">
                </td>
            </tr>
            <br>
            <tr>
                <td>Preferences :</td><br>
                <td>
                    <label>
                        <input type="checkbox"> Acrylic Painting
                    </label><br>
                    <label>
                        <input type="checkbox"> Oil Painting
                    </label><br>
                    <label>
                        <input type="checkbox"> Water Color Painting
                    </label>
                </td>
            </tr>
            <br>
            <tr>
                <td>Select Occupation</td>
                <td>
                    <select>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Engineer</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <br>
            <tr>
                <td>Bio</td>
                <td>
                    <textarea rows="6" cols="30" placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>
            <br>
            <tr>
                <td>
                    <input type="reset" value="RESET">
                </td>
                <td>
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
