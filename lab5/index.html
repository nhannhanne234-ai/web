<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox cơ bản</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .item{
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
        }
        .red{
            background: red;
            height: 200px;
        }
        .blue{
            background: blue;
        }
        .green{
            background: green;
        }
        .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            bottom: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Học FlexBox cơ bản</h2>
        <div class="container">
            <div class="item red">Box 1</div>
            <div class="item blue">Box 2</div>
            <div class="item green">Box 3</div>
        </div>
</body>
</html>
