<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 8 - Thẻ img</title>
</head>
<body>
    <h2>Yêu cầu 1: Hiển thị banner Đại học Văn Lang</h2>
    <img src="https://online.vlu.edu.vn/Content/logo/banner-yersin.jpg" alt="Banner Yersin VLU" />

    <h2>Yêu cầu 2: Hiển thị hình ảnh kích thước 100 x 100</h2>
    <img src="https://online.vlu.edu.vn/Content/logo/banner-yersin.jpg" width="100" height="100" alt="Hình 100x100" />

    <h2>Yêu cầu 3: Hiển thị hình ảnh với văn bản thay thế (alt) là "itvlu"</h2>
    <img src="https://online.vlu.edu.vn/Content/logo/banner-yersin.jpg" alt="itvlu" />
</body>
</html>
