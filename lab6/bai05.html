<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đoán số may mắn</title>
</head>
<body>
    <h2>Đoán số may mắn</h2>
    <label for="so">Nhập số từ 1 đến 10:</label>
    <input type="number" id="so" min="1" max="10">
    <button onclick="doanso()">Đoán số</button>
    <h3 id="ketqua"></h3>
    <script>
        function doanso(){
            let so = Number(document.getElementById("so").value);
            let soMay = Math.floor(Math.random() * 10) + 1;
            if(so == soMay){
                document.getElementById("ketqua").innerHTML = "Máy chọn " + soMay + ". Bạn đã thắng!";
            }else{
                document.getElementById("ketqua").innerHTML = "Máy chọn " + soMay + ". Bạn chưa may mắn!";
            }
        }
    </script>
</body>
</html>
