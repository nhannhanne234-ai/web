<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 4</title>
</head>
<body>
    <script>
        function countPositiveNumbers(arr) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > 0) {
                    count++;
                }
            }
            return count;
        }
        document.write("Result: " + countPositiveNumbers([-1, 2, 3, -4, 5]));
    </script>
</body>
</html>
