<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 15</title>
</head>
<body>
    <script>
        function removeDuplicates(arr) {
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                if (!result.includes(arr[i])) {
                    result.push(arr[i]);
                }
            }
            return result;
        }
        document.write("Result: " + JSON.stringify(removeDuplicates([1, 2, 2, 3, 4, 4, 5])));
    </script>
</body>
</html>
