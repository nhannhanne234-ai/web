<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 7</title>
</head>
<body>
    <script>
        function isAscending(arr) {
            if (arr.length <= 1) return false;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] >= arr[i + 1]) {
                    return false;
                }
            }
            return true;
        }
        document.write("Result: " + isAscending([1, 2, 3, 5]));
    </script>
</body>
</html>
