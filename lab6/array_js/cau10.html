<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 10</title>
</head>
<body>
    <script>
        function sumOfSquares(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i] * arr[i];
            }
            return sum;
        }
        document.write("Result 1: " + sumOfSquares([1, 2, 3]) + "<br>");
        document.write("Result 2: " + sumOfSquares([4, 5, 6]));
    </script>
</body>
</html>
