<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 11</title>
</head>
<body>
    <script>
        function filterEvensAndSum(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 === 0) {
                    sum += arr[i];
                }
            }
            return sum;
        }
        document.write("Result 1: " + filterEvensAndSum([1, 2, 3, 4, 5, 6]) + "<br>");
        document.write("Result 2: " + filterEvensAndSum([12, 14, 15, 19, 20, 100]));
    </script>
</body>
</html>
