<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>
</head>
<body>
    <script>
        function findMin(arr) {
            if (arr.length === 0) return null;
            let min = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }
            }
            return min;
        }
        document.write("Result: " + findMin([5, 2, 8, 1, 4]));
    </script>
</body>
</html>
