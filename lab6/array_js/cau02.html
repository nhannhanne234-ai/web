<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2</title>
</head>
<body>
    <script>
        function sumOddNumbers(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 !== 0) {
                    sum += arr[i];
                }
            }
            return sum;
        }
        document.write("Result: " + sumOddNumbers([1, 2, 3, 4, 5]));
    </script>
</body>
</html>
