<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 6</title>
</head>
<body>
    <script>
        function calculateAverage(arr) {
            if (arr.length === 0) return 0;
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
            }
            return sum / arr.length;
        }
        document.write("Result: " + calculateAverage([10, 20, 30, 40, 50]));
    </script>
</body>
</html>
