<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 14</title>
</head>
<body>
    <script>
        function findMissingNumber(arr, n) {
            let expectedSum = (n * (n + 1)) / 2;
            let actualSum = 0;
            for (let i = 0; i < arr.length; i++) {
                actualSum += arr[i];
            }
            return expectedSum - actualSum;
        }
        document.write("Result 1: " + findMissingNumber([1, 2, 4, 5, 6], 6) + "<br>");
        document.write("Result 2: " + findMissingNumber([3, 7, 1, 2, 8, 4, 5], 8) + "<br>");
        document.write("Result 3: " + findMissingNumber([1, 2, 3, 4], 4));
    </script>
</body>
</html>
