<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 13</title>
</head>
<body>
    <script>
        function calculateGrade(scores) {
            if (scores.length === 0) return "F";
            let sum = 0;
            for (let i = 0; i < scores.length; i++) {
                sum += scores[i];
            }
            let avg = sum / scores.length;
            if (avg >= 90) return "A";
            if (avg >= 80) return "B";
            if (avg >= 70) return "C";
            if (avg >= 60) return "D";
            return "F";
        }
        document.write("Result 1: " + calculateGrade([95, 90, 92]) + "<br>");
        document.write("Result 2: " + calculateGrade([75, 80, 85]));
    </script>
</body>
</html>
